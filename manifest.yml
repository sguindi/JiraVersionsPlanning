modules:
  jira:globalPage:
    - key: plan-jira-page
      title: K1-Planner
      layout: basic
      resource: main
      # Tried a single-entry `pages` array with a bundled-resource icon (resource:<key>;<path>)
      # to work around the top-level module having no icon field at all — it registered a
      # redundant sub-menu item ("K1-Planner" nested under "K1-Planner") without ever actually
      # showing the icon (still fell back to the default). Reverted; there is currently no
      # working way to set a custom nav icon for a single-page jira:globalPage app.

resources:
  - key: main
    path: static/app/build
    tunnel:
      port: 3000

app:
  id: ari:cloud:ecosystem::app/dfccc25b-0e9b-467e-a703-9a0e66cfae4f
  runtime:
    name: nodejs22.x

permissions:
  scopes:
    - manage:jira-project
    - read:jira-user
    - read:jira-work
    - write:jira-work
